name: ruflo — AI 全自主运营

on:
  schedule:
    # 每 6 小时运行一次（免费 GitHub Actions）
    - cron: '0 */6 * * *'
  # 手动触发（用于测试或强制执行）
  workflow_dispatch:
    inputs:
      cycle_name:
        description: '运行周期名称（如 Day-1-init）'
        required: false
        default: ''
        type: string
  # 代码变更后自动运行（如果 ruflo 修改了代码）
  push:
    branches: [main]
    paths:
      - 'scripts/ruflo-agent.js'
      - 'src/**'
      - 'public/**'

env:
  NODE_VERSION: '20'

jobs:
  ruflo-run:
    name: ruflo Agent — 执行运营
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 检查预算状态
        run: |
          echo "=== ruflo 运营环境检查 ==="
          echo "Node: $(node --version)"
          echo "DeepSeek API Key: ${#DEEPSEEK_API_KEY} chars"
          if [ -f FINANCIAL_LOG.md ]; then
            echo "--- 财务状态 ---"
            grep -E '\*\*当前余额\*\*' FINANCIAL_LOG.md || echo "余额未找到"
          fi
          echo "======================"

      - name: 执行 ruflo Agent
        id: ruflo
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GIT_AUTHOR_NAME: ruflo-agent
          GIT_AUTHOR_EMAIL: ruflo-agent@users.noreply.github.com
          GIT_COMMITTER_NAME: ruflo-agent
          GIT_COMMITTER_EMAIL: ruflo-agent@users.noreply.github.com
        run: |
          CYCLE_NAME="${{ github.event.inputs.cycle_name || 'scheduled-cycle' }}"
          echo ">>> ruflo 开始运营周期: $CYCLE_NAME"
          node scripts/ruflo-agent.js "$CYCLE_NAME"
          echo ">>> ruflo 运营周期完成"

      - name: 检查变更
        id: changed
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "无代码变更"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "有代码变更待提交"
            git diff --stat
          fi

      - name: 提交变更
        if: steps.changed.outputs.changed == 'true'
        env:
          GIT_AUTHOR_NAME: ruflo-agent
          GIT_AUTHOR_EMAIL: ruflo-agent@users.noreply.github.com
        run: |
          git config --local user.email "$GIT_AUTHOR_EMAIL"
          git config --local user.name "$GIT_AUTHOR_NAME"
          git add -A
          git commit -m "ruflo: auto-update from ${{ github.event.inputs.cycle_name || 'scheduled-cycle' }}"
          git push

      - name: 触发 Vercel ISR
        if: steps.changed.outputs.changed == 'true'
        env:
          VERCEL_REVALIDATE_HOOK: ${{ secrets.VERCEL_REVALIDATE_HOOK }}
        run: |
          if [ -n "$VERCEL_REVALIDATE_HOOK" ]; then
            echo "触发 Vercel ISR 重新验证..."
            curl -s -X POST "$VERCEL_REVALIDATE_HOOK" \
              -H "Content-Type: application/json" \
              -d '{"path": "/"}' \
              -w "\nHTTP Status: %{http_code}\n"
          fi
